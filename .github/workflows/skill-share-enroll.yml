name: Skill Share automatic enrollment

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: skill-share-enroll-${{ github.event.issue.user.id }}
  cancel-in-progress: false

jobs:
  enroll:
    if: github.event.repository.private == false && github.event.issue.user.type == 'User' && (github.event_name == 'issues' || (github.event.comment.user.id == github.event.issue.user.id && github.event.comment.body == '/skill-share-retry'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Load only the trusted default-branch event SHA; issue data is never executed.
      - name: Load trusted enrollment worker
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_REF: ${{ github.sha }}
        run: |
          import base64, json, os, pathlib, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['TRUSTED_REF']
          if not re.fullmatch(r'[a-f0-9]{40}', ref):
              raise SystemExit('Invalid trusted ref')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'skill-share-enrollment'
          target.mkdir(exist_ok=True)
          for name in ('enrollment-worker.mjs', 'enrollment.mjs', 'core.mjs', 'join-policy.json'):
              url = f'https://api.github.com/repos/{repo}/contents/.github/skill-share/{name}?ref={ref}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = json.load(response)
              if content.get('encoding') != 'base64':
                  raise SystemExit('Invalid trusted source encoding')
              (target / name).write_bytes(base64.b64decode(content['content']))
      - name: Validate invitation code and grant read access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENROLLMENT_PRIVATE_KEY: ${{ secrets.ENROLLMENT_PRIVATE_KEY }}
          ENROLLMENT_CODES_JSON: ${{ secrets.ENROLLMENT_CODES_JSON }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: node "$RUNNER_TEMP/skill-share-enrollment/enrollment-worker.mjs"
